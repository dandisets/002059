description: "This dataset will contain structural MRI scans and associated acquisition
  metadata from rhesus macaques (Macaca mulatta) studied in the Platt Laboratory at
  the University of Pennsylvania.\nThese data support research investigating the neural
  mechanisms of naturalistic social behavior and social decision-making in nonhuman
  primates, associated with our NIH/NIMH R01 research program.\nMRI data will be organized
  using the Brain Imaging Data Structure (BIDS), with appropriate metadata to support
  reproducibility, anatomical analysis, and future scientific research. The data will
  be shared in accordance with NIH data management and sharing requirements."
